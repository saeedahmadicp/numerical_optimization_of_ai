<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>numopt — numerical optimization, iterate by iterate</title>
    <meta
      name="description"
      content="155 numerical methods, each cited to its algorithm and equation, tested against an oracle, and replayable iterate by iterate in the browser."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0c" />
    <!-- The latin text faces load with the HTML, not after the CSS (no swap shift on load). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/newsreader/files/newsreader-latin-opsz-italic.woff2"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Shared links: Open Graph + Twitter card. __SITE_URL__ is set at build time (SITE_URL). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="numopt" />
    <meta property="og:title" content="numopt — Numerical optimization, iterate by iterate." />
    <meta
      property="og:description"
      content="Pick a problem, race up to four methods across its landscape, and read every iterate beside the update rule that produced it — with the citation it came from."
    />
    <meta property="og:image" content="__SITE_URL__social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Four optimizers on the Rosenbrock valley beside their convergence curves, with the numopt mark."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="numopt — Numerical optimization, iterate by iterate." />
    <meta
      name="twitter:description"
      content="155 numerical methods, cited, oracle-tested and replayable iterate by iterate."
    />
    <meta name="twitter:image" content="__SITE_URL__social-preview.png" />
    <script>
      // Apply a stored theme before first paint (no flash).
      try {
        var t = localStorage.getItem('numopt.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
