# Deploys the static web portal (web/dist) to GitHub Pages.
#
# Setup (once): Settings → Pages → Source: "GitHub Actions". After that, every push to main
# deploys, and Actions → Pages → Run workflow deploys by hand. The build uses a relative base
# and a hash router, so it works from the https://<user>.github.io/<repo>/ sub-path.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The build reads only committed files: web/src/generated/{registry,problems}.json and
      # research/. It does not need Python.
      - run: npm run build
        env:
          # Absolute og:image / twitter:image URLs for link previews (see web/vite/catalog.ts).
          SITE_URL: https://saeedahmadicp.github.io/numopt/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
