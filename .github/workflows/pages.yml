# Deploys the static web portal (web/dist) to GitHub Pages.
#
# Optional. To use it: Settings → Pages → Source: "GitHub Actions". Then run it by hand
# (Actions → Pages → Run workflow), or add `push: branches: [main]` under `on:` to deploy on
# every push to main. The build uses a relative base and a hash router, so it works from the
# https://<user>.github.io/<repo>/ sub-path without changes.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The build reads only committed files: web/src/generated/{registry,problems}.json and
      # research/. It does not need Python.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
