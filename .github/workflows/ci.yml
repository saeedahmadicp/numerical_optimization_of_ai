name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} (pytest, ruff, pyright)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # pyproject.toml points pyright at .venv, and web/package.json calls ../.venv/bin/*.
      # The `plot` extra (matplotlib) lets pyright check bench.py's plotting code against the real
      # matplotlib types, and runs the plot tests that skip without it.
      - name: Install numopt into .venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,plot]"
      - name: ruff check
        run: .venv/bin/ruff check src tests
      - name: ruff format --check
        run: .venv/bin/ruff format --check src tests
      - name: pyright
        run: .venv/bin/pyright
      - name: pytest
        run: .venv/bin/pytest

  research:
    name: Research studies (pytest research)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      # The studies' run.py files (which some tests import) need matplotlib: the `plot` extra.
      - name: Install numopt into .venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,plot]"
      # One process for every study: research/pytest.ini (importlib import mode) and
      # research/conftest.py keep the studies' same-named files apart. On CI, Hypothesis loads
      # its "ci" profile (derandomized, no example database), so the run is reproducible.
      - name: pytest research
        run: .venv/bin/pytest research

  parity:
    name: Parity fixtures are current (numopt export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install numopt into .venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .
      # Exports into a temporary folder and compares it with the committed web/src/generated/
      # (written on aarch64): text, counts, flags and structure exactly; x, f and ‖∇f‖ along the
      # whole trace within 1e-9 of their size in the run (+1e-12), since NumPy rounds the last
      # bits differently on another CPU. It fails when someone changed Python and did not run
      # `npm run gen` (the policy is in check_generated.py).
      - name: Compare a fresh export with web/src/generated
        run: .venv/bin/python web/tests/fixtures/check_generated.py

  web:
    name: Web (lint, format, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install numopt into .venv (for the Python reference dumps)
        working-directory: .
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # git does not store the per-lab Python dumps under web/tests/**/fixtures (~14 MB). On this
      # runner they are not canonical (tests/fixtures/platform.ts): the tests compare them with
      # their stated tolerances instead of bit for bit.
      - name: Generate the Python reference dumps
        run: npm run gen:test-fixtures
      # Replays the committed parity fixtures and the dumps with the TypeScript ports.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
