# pytest settings for the research studies: `pytest research` from the repository root (or
# `pytest` in this folder) runs every study in one process; `pytest research/<slug>` runs one.
#
# Every study has its own `test_method.py` next to its own `method.py` (and `run.py`, ...), so
# the default "prepend" import mode fails on the shared basename. "importlib" mode imports each
# test file under a unique name; `conftest.py` puts the right study folder on `sys.path` for its
# `from method import ...` imports. The package's own tests (`tests/`) keep the settings in
# `pyproject.toml`, because pytest reads the ini file nearest to the paths it is given.
[pytest]
addopts = -q --import-mode=importlib
testpaths = .
python_files = test_*.py
